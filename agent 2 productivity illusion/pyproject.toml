[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scan-revision"
version = "0.1.0"
description = "Repeatable, auditable, semi-automated master->revision gap scan"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.2",
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "PyYAML>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
nli = ["transformers>=4.30"]
prop = ["hypothesis>=6.0"]

[project.scripts]
scan_revision = "scan.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scan*", "model_sims*"]

[tool.setuptools.package-data]
scan = ["*.yaml"]
