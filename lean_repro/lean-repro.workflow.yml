name: Pinned Lean reproducibility gate
on:
  push:
    branches: [e2-v3-source-year]
    paths:
      - 'lean/**'
      - 'lean_repro/AxiomFootprint.lean'
      - 'lean_repro/AllFootprints.lean'
      - 'lean_repro/source_snapshot.tar.gz'
      - 'lean_repro/SOURCE_MANIFEST.tsv'
      - 'lean_repro/SOURCE_ARCHIVE.sha256'
      - 'lean_repro/verify_inputs.py'
      - 'lean_repro/check_footprints.py'
      - 'lean_repro/check_all_footprints.py'
      - 'lean_repro/check_whitelisted_footprints.py'
      - 'lean_repro/allowed_native_axioms_v4341.txt'
      - 'lean_repro/test_allowlist_policy.py'
      - '.github/workflows/lean-repro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source snapshot BEFORE toolchain installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean_repro/evidence
          git rev-parse HEAD | tee lean_repro/evidence/runner_commit.txt
          python3 lean_repro/verify_inputs.py | tee lean_repro/evidence/input_verification.log
          cp lean/lean-toolchain lean_repro/evidence/lean-toolchain.txt
      - name: Install toolchain manager on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile pinned default target and inspect aggregate-import footprints
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lean --version | tee lean_repro/evidence/lean_version.log
          lake --version | tee lean_repro/evidence/lake_version.log
          cd lean
          lake build 2>&1 | tee ../lean_repro/evidence/build.log
          lake env lean ../lean_repro/AxiomFootprint.lean 2>&1 | tee ../lean_repro/evidence/axioms.log
          cd ..
          python3 lean_repro/check_footprints.py lean_repro/evidence/axioms.log | tee lean_repro/evidence/footprint_verdict.log
          cd lean
          lake env lean ../lean_repro/AllFootprints.lean 2>&1 | tee ../lean_repro/evidence/all_footprints.log
          cd ..
          # Retain the old *strict* no-exception outcome separately; it is
          # expected to fail on native_decide and is never renamed clean.
          set +e
          python3 lean_repro/check_all_footprints.py lean_repro/evidence/all_footprints.log | tee lean_repro/evidence/all_footprints_verdict.log
          strict_status=${PIPESTATUS[0]}
          set -e
          test "$strict_status" -eq 0 -o "$strict_status" -eq 2
          echo "STRICT_ZERO_EXCEPTION_EXIT=$strict_status" | tee lean_repro/evidence/strict_zero_exception_status.log
          # The exact-name rule was tested report-only on the recorded corpus,
          # including mutated new-axiom, sorryAx, and malformed-log negatives.
          python3 lean_repro/test_allowlist_policy.py lean_repro/evidence/all_footprints.log | tee lean_repro/evidence/allowlist_policy_tests.log
          python3 lean_repro/check_whitelisted_footprints.py lean_repro/evidence/all_footprints.log lean_repro/allowed_native_axioms_v4341.txt --gate | tee lean_repro/evidence/allowed_footprints_verdict.log
      - name: Preserve source inputs and evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-repro-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            lean_repro/AxiomFootprint.lean
            lean_repro/AllFootprints.lean
            lean_repro/SOURCE_COMMIT.txt
            lean_repro/allowed_native_axioms_v4341.txt
            lean_repro/check_whitelisted_footprints.py
            lean_repro/test_allowlist_policy.py
            lean_repro/SOURCE_MANIFEST.tsv
            lean_repro/SOURCE_ARCHIVE.sha256
            lean_repro/source_snapshot.tar.gz
            lean_repro/evidence/
            lean/lean-toolchain
            lean/lake-manifest.json
            lean/lakefile.toml
