[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "SafeTransition"
version = "1.2.1"
description = "Exact rational certification of transition safety: typed assessment operators, backward recursion, Farkas obstruction certificates, and dashboard readings for sustainability transitions."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amin Abaee", orcid = "https://orcid.org/0000-0002-0019-1842" }]
keywords = [
    "sustainability",
    "viability theory",
    "transition safety",
    "certificates",
    "exact arithmetic",
    "composite indicators",
    "multi-criteria decision analysis",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
tests = ["pytest"]

[project.scripts]
safetransition = "safetransition.cli:main"

[project.urls]
"Verification deposit" = "https://doi.org/10.6084/m9.figshare.33764023"

[tool.setuptools.packages.find]
where = ["src"]
