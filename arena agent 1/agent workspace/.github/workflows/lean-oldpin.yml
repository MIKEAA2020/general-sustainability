name: Lean historical compiler comparison (current sources)
on:
  push:
    branches: [e2-v3-source-year]
    paths:
      - '.github/workflows/lean-oldpin.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  oldpin:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact current sources BEFORE changing temporary checkout pin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lean_repro/oldpin_evidence
          git rev-parse HEAD | tee lean_repro/oldpin_evidence/runner_commit.txt
          python3 lean_repro/verify_inputs.py | tee lean_repro/oldpin_evidence/source_check.log
          cp lean/lean-toolchain lean_repro/oldpin_evidence/source_declared_pin.txt
      - name: Install elan manager on disposable runner
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Try SAME current sources under historical v4.14.0 compiler
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cd lean
          printf 'leanprover/lean4:v4.14.0\n' > lean-toolchain
          cp lean-toolchain ../lean_repro/oldpin_evidence/temporary_comparator_pin.txt
          lean --version | tee ../lean_repro/oldpin_evidence/lean_version.log
          lake --version | tee ../lean_repro/oldpin_evidence/lake_version.log
          lake build 2>&1 | tee ../lean_repro/oldpin_evidence/build.log
          lake env lean ../lean_repro/AxiomFootprint.lean 2>&1 | tee ../lean_repro/oldpin_evidence/axioms.log
          cd ..
          python3 lean_repro/check_footprints.py lean_repro/oldpin_evidence/axioms.log | tee lean_repro/oldpin_evidence/named_verdict.log
          cd lean
          lake env lean ../lean_repro/AllFootprints.lean 2>&1 | tee ../lean_repro/oldpin_evidence/all_footprints.log
          cd ..
          python3 lean_repro/check_all_footprints.py lean_repro/oldpin_evidence/all_footprints.log | tee lean_repro/oldpin_evidence/full_verdict.log
      - name: Save source hashes and comparison logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-oldpin-current-sources-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: |
            lean_repro/SOURCE_COMMIT.txt
            lean_repro/SOURCE_MANIFEST.tsv
            lean_repro/SOURCE_ARCHIVE.sha256
            lean_repro/source_snapshot.tar.gz
            lean_repro/AxiomFootprint.lean
            lean_repro/AllFootprints.lean
            lean_repro/oldpin_evidence/
