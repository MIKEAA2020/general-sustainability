[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "typed-ledger-reference"
version = "0.1.0"
description = "Dependency-free reference prototype for typed material-flow ledger declarations"
requires-python = ">=3.10"
license = {text = "CC BY 4.0"}
readme = "README.md"
authors = [{name = "Amin Abaee"}]

[tool.pytest.ini_options]
testpaths = ["test_typed_ledger.py"]
