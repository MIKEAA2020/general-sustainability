<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Typed ledger, service readout and two aggregation failure modes</title>
  <desc id="desc">A typed material ledger keeps compartments and donor-limited fluxes separate, derives service readouts outside the conserved state, and rejects compensatory aggregation and hidden support-pool drawdown as certification shortcuts.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#24364b"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#217a5b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1c2b3a" flood-opacity="0.13"/></filter>
    <style>
      .bg{fill:#f7f9fb}.panel{fill:#fff;stroke:#cfdae4;stroke-width:2}.blue{fill:#eaf2fb;stroke:#3978aa;stroke-width:2}.green{fill:#eaf7f0;stroke:#398567;stroke-width:2}.amber{fill:#fff6e4;stroke:#c68a2e;stroke-width:2}.red{fill:#fff0ef;stroke:#bd6058;stroke-width:2}.ink{fill:#1d2d3d;font-family:Arial,Helvetica,sans-serif}.h{font-size:25px;font-weight:700}.sub{font-size:18px;font-weight:700}.body{font-size:17px}.small{font-size:15px}.tiny{font-size:13px}.muted{fill:#516273}.arrow{stroke:#24364b;stroke-width:3;fill:none;marker-end:url(#arrow)}.greenLine{stroke:#217a5b;stroke-width:3;fill:none;marker-end:url(#greenArrow)}.dashed{stroke-dasharray:9 7}.tag{font-size:14px;font-weight:700;letter-spacing:1px}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1400" height="760" rx="18"/>
  <text class="ink h" x="54" y="58">Typed ledger → certified readouts, not one compensating scalar</text>
  <text class="ink muted body" x="54" y="88">Compartments carry declared types and units; every cross-type conversion is an explicit routed flux.</text>

  <rect class="panel" filter="url(#shadow)" x="50" y="130" width="530" height="470" rx="18"/>
  <text class="ink sub" x="78" y="172">1  Typed material state</text>
  <text class="ink muted small" x="78" y="199">x(t), type structure T, incidence S<tspan baseline-shift="sub" font-size="12">T</tspan></text>
  <rect class="blue" x="82" y="235" width="206" height="88" rx="12"/>
  <text class="ink sub" x="103" y="269">Natural donor</text><text class="ink body" x="103" y="296">A</text><text class="ink small" x="115" y="301">geo</text><text class="ink body" x="140" y="296">, N, biomass</text>
  <rect class="blue" x="340" y="235" width="206" height="88" rx="12"/>
  <text class="ink sub" x="361" y="269">Active pool</text><text class="ink body" x="361" y="296">A</text><text class="ink small" x="373" y="301">act</text><text class="ink body" x="398" y="296">, product, stock</text>
  <rect class="green" x="82" y="368" width="206" height="88" rx="12"/>
  <text class="ink sub" x="103" y="402">Regenerative pool</text><text class="ink body" x="103" y="429">U, recovery, return</text>
  <rect class="amber" x="340" y="368" width="206" height="88" rx="12"/>
  <text class="ink sub" x="361" y="402">Boundary / sink</text><text class="ink body" x="361" y="429">waste, export, loss</text>
  <path class="arrow" d="M288 279 L340 279"/><text class="ink tiny muted" x="314" y="220" text-anchor="middle">conversion / transfer</text>
  <path class="greenLine" d="M185 368 L185 323"/><text class="ink tiny muted" x="95" y="350">return flux</text>
  <path class="arrow" d="M443 323 L443 368"/><text class="ink tiny muted" x="455" y="348">loss</text>
  <text class="ink body" x="82" y="510">Donor limitation: primitive outflows vanish</text>
  <text class="ink body" x="82" y="535">when their source compartment is empty.</text>
  <text class="ink tag" x="82" y="574" fill="#3978aa">BALANCE · CONSERVATION · POSITIVITY</text>

  <path class="arrow" d="M580 365 L685 365"/><text class="ink small muted" x="594" y="340">declared O(x)</text>
  <rect class="green" filter="url(#shadow)" x="685" y="235" width="270" height="260" rx="18"/>
  <text class="ink sub" x="714" y="277">2  Service readout</text>
  <text class="ink body" x="714" y="315">O(x, u, θ)</text>
  <text class="ink small" x="714" y="351">water supplied</text>
  <text class="ink small" x="714" y="378">crop yield</text>
  <text class="ink small" x="714" y="405">fish caught</text>
  <text class="ink small" x="714" y="432">economic / institutional</text>
  <text class="ink small" x="714" y="456">readouts</text>
  <text class="ink tag" x="714" y="478" fill="#217a5b">OBSERVABLE, NOT MASS</text>

  <path class="arrow dashed" d="M955 300 L1060 210"/><path class="arrow dashed" d="M955 430 L1060 520"/>
  <rect class="red" filter="url(#shadow)" x="1060" y="130" width="290" height="205" rx="18"/>
  <text class="ink sub" x="1090" y="172">3a  Arithmetic illusion</text>
  <text class="ink body" x="1090" y="210">wᵀb ≥ 0 can coexist with</text>
  <text class="ink body" x="1090" y="237">bᵢ &lt; 0.</text>
  <text class="ink small" x="1090" y="275">A positive aggregate is not a</text>
  <text class="ink small" x="1090" y="299">componentwise certificate.</text>
  <text class="ink tag" x="1090" y="321" fill="#bd6058">NO COMPENSATORY CERTIFICATE</text>

  <rect class="amber" filter="url(#shadow)" x="1060" y="425" width="290" height="205" rx="18"/>
  <text class="ink sub" x="1090" y="467">3b  Dynamical illusion</text>
  <text class="ink body" x="1090" y="505">high yield can coexist with</text>
  <text class="ink body" x="1090" y="532">support-pool drawdown.</text>
  <text class="ink small" x="1090" y="570">Throughput is not regeneration;</text>
  <text class="ink small" x="1090" y="594">a readout is not a forecast.</text>
  <text class="ink tag" x="1090" y="616" fill="#c68a2e">LABEL THE HIDDEN DRAW</text>

  <text class="ink muted small" x="55" y="691">Figure. The ledger's type, incidence and donor rules are certification objects. Services and time-like indicators are readouts</text>
  <text class="ink muted small" x="55" y="716">with declared status; neither a scalar aggregate nor an isolated gross rate can replace the componentwise account.</text>
</svg>
